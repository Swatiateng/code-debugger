spring.application.name=system
app.ai.provider=ollama
app.ai.base-url=http://localhost:11434/api/chat
app.ai.model=qwen2.5-coder:1.5b




# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/debuggingsystem?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Production-safe: Hibernate checks tables but does not alter them
spring.jpa.hibernate.ddl-auto=validate

# Docker Sandbox Configuration
app.execution.docker.image=code-debugger-sandbox:latest
app.execution.docker.timeout-seconds=30
app.execution.docker.memory=256m
app.execution.docker.cpus=1