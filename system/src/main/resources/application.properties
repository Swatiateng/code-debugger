spring.application.name=system
app.ai.provider=groq
app.ai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
app.ai.model=${GROQ_MODEL:qwen/qwen3.8-27b}
app.ai.api-key=${GROQ_API_KEY:}




# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/debuggingsystem?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Production-safe: Hibernate checks tables but does not alter them
spring.jpa.hibernate.ddl-auto=validate

# Remote code runner configuration (Render environment variables)
app.execution.runner.url=${SANDBOX_URL:}
app.execution.runner.secret=${SANDBOX_SECRET:}
